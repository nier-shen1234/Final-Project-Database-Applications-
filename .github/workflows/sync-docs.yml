name: Sync Google Doc to GitHub

on:
  schedule:
    - cron: '0 0 * * *' # Updates automatically every night at midnight UTC
  workflow_dispatch: # Lets you click a button to sync manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Google Doc Text Directly
        run: |
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://google.com" -o final-project-draft.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'Doc Sync Bot'
          git config --global user.email 'bot@github.com'
          git add final-project-draft.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: automatic update from Google Docs" && git push)

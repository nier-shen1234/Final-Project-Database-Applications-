name: Sync Google Doc to GitHub

on:
  schedule:
    - cron: '0 0 * * *' # Updates automatically every night at midnight UTC
  workflow_dispatch: # Lets you click a button to sync manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Google Doc Text Directly
        run: |
          cat << 'EOF' > download_doc.py
          import urllib.request

          # Using your exact URL ending in Gc
          url = "https://google.com"
          
          req = urllib.request.Request(
              url, 
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          )
          
          try:
              with urllib.request.urlopen(req) as response:
                  text_data = response.read().decode('utf-8')
              
              with open('final-project-draft.md', 'w', encoding='utf-8') as f:
                  f.write(text_data)
              print("Download successful!")
          except Exception as e:
              print(f"Error downloading file: {e}")
              exit(1)
          EOF
          python download_doc.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'Doc Sync Bot'
          git config --global user.email 'bot@github.com'
          git add final-project-draft.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: automatic update from Google Docs" && git pull --rebase origin main && git push)

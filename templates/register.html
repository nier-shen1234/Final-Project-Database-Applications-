<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px;">
    <h2>Create an Account</h2>
    <form method="POST">
        <label>Username:</label><br>
        <input type="text" name="username" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
        
        <label>Email:</label><br>
        <input type="email" name="email" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
        
        <label>Password:</label><br>
        <input type="password" name="password" required style="width: 100%; padding: 8px; margin-bottom: 20px;"><br>
        
        <button type="submit" style="padding: 10px 15px; background: #d35400; color: white; border: none; border-radius: 4px;">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
</body>
</html>
